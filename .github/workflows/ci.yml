name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: go build -o failshut ./cmd/failshut
      - name: smoke
        shell: bash
        run: |
          ./failshut version
          ./failshut audit --help
          ./failshut audit --json >/tmp/out.json || true
          ./failshut help | head -5
